[project]
id      = "image"
version = "0.8.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi  = "sysv64"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys  = "linux"
abi  = "aapcs64"

[target.darwin-aarch64]
arch = "aarch64"
sys  = "darwin"
abi  = "darwinpcs"

[profile.debug]
default  = true
optimize = false
debug    = true
simd     = "scalarize"

[profile.release]
optimize = true
debug    = false
simd     = "scalarize"

# the library, and the only artifact a bare `mach build .` selects
[artifact.image]
kind    = "static"
entry   = "lib/image.mach"
out     = "{project.work}/lib/libimage{artifact.suffix}"
targets = ["*"]
link    = []
need    = []
default = true
export  = true

# test-only: reaches the modules whose tests the library does not, for `mach test . -a tests`
[artifact.tests]
kind    = "static"
entry   = "lib/tests.mach"
out     = "{project.work}/lib/libtests{artifact.suffix}"
targets = ["*"]
link    = []
need    = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.deflate]
git = "https://github.com/briar-systems/mach-deflate"
ref = "branch/dev"
