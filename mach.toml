[project]
id      = "image"
version = "0.7.1"
mach    = "^6"
src     = "src"
out     = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt   = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt   = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

# the library, and the only artifact `mach build .` and `--all-targets` select
[artifact.image]
kind    = "static"
entry   = "lib/image.mach"
out     = "lib/image"
targets = ["*"]
link    = []
need    = []
default = true

# test-only: reaches the modules whose tests the library does not, for `mach test . --lib tests`
[artifact.tests]
kind    = "static"
entry   = "lib/tests.mach"
out     = "lib/tests"
targets = ["*"]
link    = []
need    = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.0"
