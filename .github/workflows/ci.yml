name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, aarch64-linux, x86_64-windows, aarch64-darwin, x86_64-darwin]

permissions:
  contents: read

jobs:
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      # std 9 needs mach 6, so this seeds v6.0.0 until the family pin moves
      mach-version: v6.0.0
      # mach tests one artifact's closure, and src/pngsuite.mach is reached only by the tests artifact
      test-selections: '[["--lib", "tests"]]'

  gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
